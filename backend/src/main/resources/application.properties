spring.application.name=electrohub
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electrohub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:electrohub}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=versioned:missing
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=60m
server.error.include-message=never
app.owner.email=${ADMIN_EMAIL:}
app.owner.password=${ADMIN_PASSWORD:}
app.seed=${SEED_CATALOG:true}
app.upload-dir=${UPLOAD_DIR:uploads}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Transactional email (Amazon SES SMTP recommended in production)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:email-smtp.ap-south-1.amazonaws.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# OTP. Keep providers disabled until live credentials are added.
app.otp.pepper=${OTP_PEPPER:}
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.msg91.enabled=${MSG91_ENABLED:false}
app.msg91.auth-key=${MSG91_AUTH_KEY:}
app.msg91.template-id=${MSG91_TEMPLATE_ID:}

# Image storage. Use local while developing; set STORAGE_PROVIDER=r2 for production.
app.storage.provider=${STORAGE_PROVIDER:local}
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
